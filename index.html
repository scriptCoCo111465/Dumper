<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>THE BUTTERFLY AWAKENS</title>
  <style>
    body {
      background: #050505;
      color: #11ff99;
      font-family: 'Courier New', monospace;
      text-align: center;
      margin: 0;
      padding: 40px 20px;
      line-height: 2.3;
    }
    img {
      max-width: 100%;
      width: 720px;
      border: 2px solid #11ff99;
      box-shadow: 0 0 40px rgba(17, 255, 153, 0.4);
      margin: 30px 0;
    }
    .hint {
      font-size: 1.4em;
      margin: 40px 0;
      letter-spacing: 3px;
    }
    button {
      background: transparent;
      color: #11ff99;
      border: 2px solid #11ff99;
      padding: 18px 60px;
      font-size: 1.3em;
      cursor: pointer;
      margin: 30px 0;
      transition: all 0.4s;
    }
    button:hover {
      background: #11ff99;
      color: #000;
      box-shadow: 0 0 35px #11ff99;
    }
    #result {
      display: none;
      font-size: 1.32em;
      color: #ffdd88;
      margin: 50px 0;
      letter-spacing: 5px;
      line-height: 2.8;
    }
  </style>
</head>
<body>
  <h1>THE BUTTERFLY AWAKENS</h1>
  
  <img src="gkHS6.jpg" alt="The Butterfly">

  <div class="hint">
    Find the hidden English.<br>
    The name is good.
  </div>

  <button onclick="decrypt()">DECRYPT</button>

  <div id="result"></div>

  <script>
    function decrypt() {
      const result = document.getElementById('result');
      result.style.display = "block";
      result.innerHTML = `
        去 的<br>
        Б frère о<br>
        씨<br>
        . <br>
        茶<br>
        . ws<br><br>
        
        <span style="color:#ffaa66; font-size:1.05em;">
          Combine them carefully.
        </span>
      `;
    }
  </script>
</body>
</html>
